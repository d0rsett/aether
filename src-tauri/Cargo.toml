[package]
name = "aether"
version = "0.1.0"
description = "Local-first Markdown workspace"
edition = "2021"
rust-version = "1.90"

[workspace]
exclude = ["crates/aether-core"]
resolver = "2"

[features]
e2e = []

[lib]
name = "aether_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aether-core = { path = "crates/aether-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows-sys = {version="0.61",features= ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
