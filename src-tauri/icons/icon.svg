<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Aether — Frosted Knowledge Graph</title>
  <desc id="desc">A sharp constellation symbol above a blurred knowledge graph inside a translucent glass tile. All blur is contained in the icon.</desc>
  <defs>
    <linearGradient id="glass" x1="82" y1="56" x2="412" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset=".46" stop-color="#E8EBF4" stop-opacity=".14"/>
      <stop offset="1" stop-color="#D0D5E4" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="rim" x1="84" y1="65" x2="430" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset=".4" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset=".76" stop-color="#FFFFFF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="mark" x1="178" y1="145" x2="350" y2="359" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".96"/>
      <stop offset="1" stop-color="#DDE0E9" stop-opacity=".72"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="17" flood-color="#101322" flood-opacity=".24"/>
    </filter>
    <filter id="frost" x="40" y="40" width="432" height="432" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="lift" x="80" y="80" width="352" height="352" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#252938" flood-opacity=".22"/>
    </filter>
    <filter id="graph-blur" x="40" y="40" width="432" height="432" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <clipPath id="tile"><rect x="64" y="64" width="384" height="384" rx="94"/></clipPath>
    <g id="symbol">
      <path d="m26 43 36 19 27-35M62 62l35 27M62 62 38 99M26 43l12 56" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="currentColor"><circle cx="26" cy="43" r="10"/><circle cx="62" cy="62" r="14"/><circle cx="89" cy="27" r="10"/><circle cx="97" cy="89" r="11"/><circle cx="38" cy="99" r="9"/></g>
    </g>
  </defs>
  <rect x="64" y="64" width="384" height="384" rx="94" fill="#24252B"/>
  <rect x="64" y="64" width="384" height="384" rx="94" fill="url(#glass)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <g filter="url(#frost)" opacity=".55">
      <ellipse cx="133" cy="146" rx="130" ry="95" fill="#E0E3EE" fill-opacity=".65"/>
      <ellipse cx="371" cy="351" rx="120" ry="110" fill="#9AA2BB" fill-opacity=".55"/>
      <ellipse cx="355" cy="100" rx="85" ry="55" fill="#FFFFFF" fill-opacity=".35"/>
    </g>
    <g filter="url(#graph-blur)" opacity=".72">
      <g stroke="#F1F3FA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M74 196 118 131 207 111 276 157 349 111 418 166 389 233 434 302 364 368 280 402 204 363 121 395 88 305 74 196Z"/>
        <path d="m118 131 41 101 48-121M159 232l117-75 19 115 94-39M159 232l-71 73 116 58 91-91 69 96M295 272l139 30M204 363l76 39M121 395l83-32M349 111l40 122M159 232l45 131M276 157l142 9"/>
      </g>
      <g fill="#F1F3FA">
        <circle cx="74" cy="196" r="9"/><circle cx="118" cy="131" r="12"/>
        <circle cx="207" cy="111" r="8"/><circle cx="276" cy="157" r="12"/>
        <circle cx="349" cy="111" r="10"/><circle cx="418" cy="166" r="9"/>
        <circle cx="159" cy="232" r="15"/><circle cx="295" cy="272" r="14"/>
        <circle cx="389" cy="233" r="11"/><circle cx="434" cy="302" r="9"/>
        <circle cx="364" cy="368" r="13"/><circle cx="280" cy="402" r="8"/>
        <circle cx="204" cy="363" r="12"/><circle cx="121" cy="395" r="10"/>
        <circle cx="88" cy="305" r="11"/>
      </g>
    </g>
    <path d="M71 181C175 123 274 114 445 139" stroke="#FFFFFF" stroke-opacity=".13" stroke-width="70" filter="url(#frost)"/>
  </g>
  <rect x="65" y="65" width="382" height="382" rx="93" stroke="url(#rim)" stroke-width="2"/>
  <g filter="url(#lift)">
    <g transform="translate(96 96) scale(2.5)">
      <use href="#symbol" color="#E9EBF2" opacity=".88"/>
    </g>
    <g transform="translate(96 94.5) scale(2.5)" opacity=".35">
      <use href="#symbol" color="#FFFFFF"/>
    </g>
  </g>
</svg>
