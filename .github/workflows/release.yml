name: Release builds

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (empty uses the workflow ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            args: --bundles nsis -- --locked
          - os: macos-15-intel
            platform: macos-universal
            args: --target universal-apple-darwin --bundles app,dmg -- --locked
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm run repo:check
      - run: npm run format:check
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/crates/aether-core/Cargo.toml
      - run: npm run tauri -- build ${{ matrix.args }}
      - name: Prepare Windows portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          Copy-Item -LiteralPath src-tauri/target/release/aether.exe -Destination "Aether_${releaseVersion}_Windows_x64.exe" -ErrorAction Stop
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/Aether.app Aether-macos-universal.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aether-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            Aether_*_Windows_x64.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            Aether-macos-universal.app.zip
